name: weedguard
description: AI-powered weed identification and targeted intervention for farmers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  supabase_flutter: ^2.3.4
  go_router: ^13.2.0
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^5.0.2
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  http: ^1.2.0
  path_provider: ^2.1.2
  image: ^4.1.7
  geolocator: ^11.0.0
  fl_chart: ^0.67.0
  shimmer: ^3.0.0
  timeago: ^3.6.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  permission_handler: ^11.3.0
  loading_animation_widget: ^1.2.0+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
